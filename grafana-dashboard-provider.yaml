apiVersion: 1

providers:
  - name: 'Default Provider'
    orgId: 1
    folder: ''                 # Folder in Grafana UI (empty = General)
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10  # Automatically reload changes
    options:
      path: /var/lib/grafana/dashboards
