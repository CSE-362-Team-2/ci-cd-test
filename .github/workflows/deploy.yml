name: Deploy to Tailscale Arch VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ""
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Arch VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull latest changes or clone if repo doesn't exist on VM
            if [ ! -d "my-app" ]; then
              git clone https://github.com/A7reus/ci-cd-test.git my-app
            fi
            cd my-app
            git pull origin main

            # Rebuild and restart the Docker container
            docker build -t demo-app .
            docker stop demo-container || true
            docker rm demo-container || true
            docker run -d --name demo-container --restart unless-stopped -p 8000:8000 demo-app
