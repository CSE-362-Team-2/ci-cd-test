name: Deploy to Azure Ubuntu VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Clone repo if it doesn't exist yet on VM, otherwise pull latest code
            if [ ! -d "my-app" ]; then
              git clone https://github.com/A7reus/ci-cd-test.git my-app
            fi
            cd my-app
            git pull origin main

            # Build new Docker image
            docker build -t demo-app .

            # Replace old running container
            docker stop demo-container || true
            docker rm demo-container || true
            docker run -d --name demo-container --restart unless-stopped -p 8000:8000 demo-app

            # Clean up dangling images to keep your VM lightweight
            docker image prune -f
