name: CI (Build & Test)

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main", "release"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (Validation)
        run: |
          docker build -t demo-app .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Placeholder for running unit & integration tests..."
